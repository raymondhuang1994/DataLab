name: DataLab cross-platform checks
on: [push, pull_request, workflow_dispatch]
jobs:
  runtime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e ".[dev,parquet,interactive]"
      - run: python tools/check_package.py
      - run: python -m pytest -q
      - run: python skills/data-lab/scripts/run.py doctor
      - run: python evaluations/run_benchmarks.py --out benchmark-output
      - run: python tools/package.py --out ../release-test

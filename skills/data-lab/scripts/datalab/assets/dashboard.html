<body>
<main id="dashboard">
  <header class="masthead"><div><h1 id="title"></h1><p class="source-line" id="source"></p></div><span class="brand">DataLab</span></header>
  <div class="status" aria-live="polite"><span class="mode" id="mode"></span><span class="times" id="checked"></span><span class="times" id="changed"></span><button id="refresh" type="button">立即检查</button></div>
  <div class="banner error" id="error" role="alert" hidden></div>
  <div class="banner" id="truncated" hidden></div>
  <section class="controls" aria-label="分析条件">
    <label>指标<select id="metric"></select></label>
    <label>汇总方式<select id="agg"><option value="sum">合计</option><option value="mean">平均值（未加权）</option><option value="median">中位数</option><option value="count_rows">行数</option><option value="count_nonmissing">非空值数量</option><option value="count_distinct">去重数量</option><option value="ratio">分子合计 / 分母合计</option><option value="weighted_mean">加权平均</option></select></label>
    <label>分组字段<select id="group"></select></label>
    <label>分组筛选<select id="category"></select></label>
    <label>日期字段<select id="date"></select></label>
    <label style="grid-column:span 2">日期范围<span style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-width:0"><input id="start" type="date" aria-label="起始日期"><input id="end" type="date" aria-label="结束日期"></span></label>
  </section>
  <div class="actions"><button id="reset" type="button">重置筛选</button><span class="method" id="method"></span></div>
  <section class="metrics" aria-label="当前筛选结果" aria-live="polite">
    <div><div class="metric-label" id="metric-label"></div><div class="metric-value" id="metric-value"></div></div>
    <div><div class="metric-label">筛选后数据行</div><div class="metric-value" id="row-count"></div></div>
    <div><div class="metric-label">指标缺失或无效</div><div class="metric-value" id="missing-count"></div></div>
  </section>
  <section class="charts" aria-label="联动图表">
    <div class="chart"><div class="chart-head"><h2>日期趋势</h2><span class="method" id="trend-unit"></span></div><p class="chart-note" id="trend-note"></p><div id="trend"></div></div>
    <div class="chart"><div class="chart-head"><h2>分组比较</h2><span class="method" id="group-unit"></span></div><p class="chart-note" id="group-note"></p><div id="bars"></div></div>
  </section>
  <section class="table-section"><div class="table-toolbar"><h2>筛选后的明细</h2><div class="pagination"><span id="page-info"></span><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button></div></div><div class="table-wrap"><table id="table"><thead></thead><tbody></tbody></table></div></section>
  <details><summary>数据来源与刷新记录</summary><dl class="trace" id="trace"></dl></details>
</main>
<script id="bootstrap" type="application/json" nonce="__SCRIPT_NONCE__">__BOOTSTRAP_JSON__</script>

    byId('truncated').textContent=`汇总与图表使用全部符合条件的数据；明细仅可浏览前 ${number.format(data.detail_available||0)} / ${number.format(data.detail_total||0)} 行。`; 
    const trace=byId('trace');trace.replaceChildren();
    [['文件',data.source.file_name],['源文件 SHA-256',data.source.sha256||'尚无'],['源文件修改时间',formatTime(data.source.modified_at)],['最近成功读取',formatTime(data.status.last_success)],['最近检测到内容变更',formatTime(data.status.last_changed)],['最近检查',formatTime(data.status.last_checked)],['计算范围',`完整源表 ${data.rows_total} 行，指标过滤后按当前筛选重新计算`] ].forEach(([label,value])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;trace.append(dt,dd);});
  }
  function renderCurrent() {
    filtered=live?data.records:selectRows();
    const stats=live?data.aggregate:sumStats(filtered),spec=metricSpec();
    const label=`${spec.label||state.metric||'记录数'} / ${aggregationName[spec.aggregation]||spec.aggregation}`;
    byId('metric-label').textContent=label;byId('metric-value').textContent=live?(data.formatted_value??'—'):displayValue(stats?.value);
    byId('row-count').textContent=number.format(stats?.eligible_rows||0);
    byId('missing-count').textContent=stats?number.format(stats.eligible_rows-stats.valid_rows):'—';
    byId('trend-unit').textContent=byId('group-unit').textContent=label;
    const notes={ratio:'按共同有效记录重算分子合计 / 分母合计；零分母显示未定义。',weighted_mean:'按共同有效记录重算加权平均；零权重合计显示未定义。',count_rows:'统计符合指标条件的数据行，包括指标缺失记录。',count_nonmissing:'仅统计指定字段的非空值；与分析报告使用相同口径。',count_distinct:'对当前筛选结果重新去重，排除空值。',mean:'逐行简单平均，未加权；整体比率应注册分子、分母定义。'};
    byId('method').textContent=(data.metric_locked?'指标定义已锁定。':'')+(notes[spec.aggregation]||'缺失及非有限数值不参与计算；使用当前筛选的完整记录。')+(data.precision_notice||'');
    renderStatus();drawTrend();drawBars();renderTable();
  }
  async function queryLive() {
    const sequence=++querySequence,requested={...state};
    try {
      const response=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(requested),cache:'no-store',credentials:'same-origin'});
      if(!response.ok)throw new Error(`查询失败（${response.status}），请检查字段和筛选条件。`);
      const next=await response.json();if(sequence!==querySequence)return;
      data=next;state=next.query;networkError='';configure();renderCurrent();
    }catch(error){if(sequence===querySequence){networkError=error.message;renderStatus();}}
  }
  function render() {
    if(live){queryLive();return;}
    try{networkError='';renderCurrent();}catch(error){networkError=error.message;renderStatus();}
  }
  fields.forEach(key=>controls[key].addEventListener('change',()=>{
    state[key]=controls[key].value;state.page=0;
    if(key==='metric'){const column=data.columns.find(c=>c.name===state.metric);state.agg=state.metric?(column?.numeric?(column?.rate?'mean':'sum'):'count_nonmissing'):'count_rows';}
    if(key==='agg'&&state.agg==='count_rows')state.metric='';
    if(key==='group')state.category='';
    if(key==='date'){state.start='';state.end='';}
    configure();render();
  }));
  byId('reset').addEventListener('click',()=>{configure(false);render();});
  byId('previous').addEventListener('click',()=>{state.page=Math.max(0,state.page-1);live?render():renderTable();});
  byId('next').addEventListener('click',()=>{state.page++;live?render():renderTable();});
  async function refresh(force=false) {
    if(!live||busy)return;busy=true;byId('refresh').disabled=true;
    try {
      const response=await fetch('/api/data'+(force?'?refresh=1':''),{cache:'no-store',credentials:'same-origin'});
      if(!response.ok)throw new Error(`本地服务返回 ${response.status}`);
      const next=await response.json();
            data=next;networkError='';
      configure();await queryLive();
    } catch(error) {networkError='无法连接本地刷新服务；请确认 serve 命令仍在运行。';renderStatus();}
    finally {busy=false;byId('refresh').disabled=false;}
  }
  byId('refresh').addEventListener('click',()=>refresh(true));
  if(data.preferences?.charts?.color)document.documentElement.style.setProperty('--brand',data.preferences.charts.color);
  configure();render();
  if(live)timer=setInterval(refresh,Math.max(2000,data.status.interval_seconds*1000));
  const resize=new ResizeObserver(()=>{drawTrend();drawBars();});resize.observe(byId('trend'));resize.observe(byId('bars'));
  window.addEventListener('pagehide',()=>{if(timer)clearInterval(timer);resize.disconnect();},{once:true});
})();
</script>
</body>
</html>
